# EVENTLINE Lokale KI — Compose-Stack auf dem Rig (Vertrag: docs/lokale-ki/SPEC.md §2.1)
#
# Netz-Idee: «ki-intern» ist internal (keine Default-Route, kein Internet). Der
# Dienst hängt NUR dort und erreicht die Aussenwelt ausschliesslich über den
# Squid-Proxy «egress», der die Erlaubnisliste (Supabase + FSM) durchsetzt.
# Caddy hängt in beiden Netzen: aussen für Zertifikat (DNS-01) und Büro/VPN,
# innen für den Weg zum Dienst. Ollama/Whisper/DB sehen nie das Internet.
#
# Immer mit --env-file /etc/eventline-ki/env starten (install.sh und die
# systemd-Unit tun das): daraus werden ${PG_PASSWORD} und die Modellnamen
# interpoliert. Ohne die Datei bricht Compose mit klarer Meldung ab.
#
# Alle Daten (Modelle, DB, Temp-Dateien, Zertifikate) liegen unter
# /srv/eventline-ki/data — dem LUKS-Tresor. Nichts landet im Overlay.

name: eventline-ki

# CPU-Vorrang (SPEC §1.4/§2.1): Der Rig läuft mit cgroup v2 + systemd-Treiber; Docker
# rechnet cpu_shares in cpu.weight um. Gemessen auf dem Rig (Docker 29.8, runc mit
# quadratischer Umrechnung): 1024 → 100 (= Schwarm und alle anderen Container),
# 2048 → 173, 5220 → 368. Der SPEC-Wert 2048 gibt der KI also 1,7× das Gewicht des
# Schwarms. Achtung bei Runtime-Wechsel: die ältere lineare Umrechnung
# (1 + (shares−2)·9999/262142) ergäbe für 2048 nur 79 — dann hier nachmessen:
#   cat /sys/fs/cgroup/system.slice/docker-<id>.scope/cpu.weight
x-cpu-vorrang: &cpu_vorrang 2048

# Speicher-Rahmen (Masterplan §2.1, E2.1): alle Container dieses Stacks laufen im systemd-Slice
# system-eventlineki.slice (systemd/system-eventlineki.slice: MemoryMax=22G, CPUWeight=800), Geschwister
# von system-trustone.slice. Name bewusst ohne Bindestrich: bei systemd ist «-» die Hierarchie —
# «eventline-ki.slice» läge als eventline.slice/eventline-ki.slice ausserhalb von system.slice, und das
# CPU-Gewicht wäre nicht mehr mit Trust one vergleichbar. Docker 29.8 mit systemd-Treiber + cgroup v2
# (geprüft 2026-10-11) legt docker-<id>.scope darunter an; install.sh installiert den Slice vor dem Start.
x-ki-slice: &ki_slice system-eventlineki.slice

# Bei Speichernot des ganzen Rigs trifft der Kernel zuerst Trust-one-Prozesse (oom_score_adj 0);
# läuft der KI-Slice selbst voll, stirbt darin zuerst ollama-gruendlich (−300, grösster Verbrauch).
x-oom-ki: &oom_ki -500

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: cdi
            device_ids: ["nvidia.com/gpu=all"]
            # Vom Compose-Schema (v5) verlangt, bei CDI aber ohne Wirkung — die Geräte-IDs zählen.
            capabilities: [gpu]

# Images sind nach dem ersten erfolgreichen Lauf (2026-10-02) festgenagelt: Versions-Tag,
# wo es einen gibt, sonst der Digest des geprüften Standes. Aktualisieren = bewusst
# hier ändern, install.sh laufen lassen, SPEC §5 wiederholen.
services:
  ollama:
    image: ollama/ollama:0.35.1
    container_name: eventline-ki-ollama
    restart: unless-stopped
    networks: [ki-intern]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Atmen (SPEC §1.4): Modelle nach 5 min Leerlauf entladen. Höchstens zwei gleichzeitig: das
      # Sprachmodell und das kleine Einbettungsmodell bge-m3 (0,6 GB, Ordnerwahl nach Vorbild) — mit
      # nur einem lud jede Ablage zweimal um (Einbettung ↔ Sprachmodell, je 3–6 s, gemessen 2026-10-04).
      # Passt ein drittes Modell nicht in den VRAM, entlädt Ollama das am längsten unbenutzte.
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      # VRAM sparen, damit das Modell ganz auf die Karte passt (8 GB, davon ~1,2 GB dauerhaft
      # beim Schwarm): Flash-Attention fest an und KV-Cache in 8 bit statt 16 (halbiert den
      # Cache, Qualitätsverlust nicht messbar). llama.cpp lässt zusätzlich 1 GB frei
      # (--fit-target), das bleibt dem Schwarm für kurzlebige GPU-Prozesse.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Teilt den Modellspeicher mit ollama-gruendlich (dort nur lesend): nie unbenutzte Blobs löschen.
      OLLAMA_NOPRUNE: "1"
      # Prompt-Cache von llama-server AUS (README «Speicher der GPU-Instanz: Prompt-Cache aus», 15.10.2026). Ollama
      # 0.35.1 startet llama-server ohne --cache-ram, also mit 8192 MiB Host-RAM für zwischengespeicherte Prompts:
      # vor jedem neuen Auftrag legt er den letzten Prompt dort ab (~0,2–0,35 GiB je Prompt mit gemma3:4b, ctx 8192),
      # frei erst beim Entladen nach OLLAMA_KEEP_ALIVE. Nach ~40 Dokumenten am Stück 8,8 GiB von 12g — mit «Arbeiten,
      # wenn frei» ein Absturzrisiko. Treffer bringt er kaum (Gemma: Sliding-Window-Attention; Rechnen ~4900
      # Prompt-Tokens/s). llama-server erbt die Umgebung von «ollama serve» und liest LLAMA_ARG_CACHE_RAM wie
      # «--cache-ram»; im Log steht dann «prompt cache is disabled».
      LLAMA_ARG_CACHE_RAM: "0"
    volumes:
      - /srv/eventline-ki/data/ollama:/root/.ollama
    cgroup_parent: *ki_slice
    oom_score_adj: *oom_ki
    cpu_shares: *cpu_vorrang
    # SPEC sagt 8g — damit wurde qwen2.5vl:7b beim Modellwechsel vom Kernel getötet
    # (memcg-OOM, gemessen am 2026-10-02): Die Gewichte sind mmap-gelesen, der Seitencache
    # des vorherigen Modells (5,2 GB) zählt im selben cgroup mit, dazu die Entschlüsselung
    # vom LUKS-Tresor. 12g deckt zwei 6-GB-Modelle nacheinander; es ist Cache, kein
    # dauerhaft belegter Speicher, der Schwarm (MemoryMax 16G) bleibt unberührt.
    mem_limit: 12g
    <<: *gpu
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Hauptmodell (Masterplan §2.2, Stufe A): nur Prozessor, kein GPU-Gerät → kein CUDA-Speicher, keine
  # Konkurrenz um die 8 GB VRAM. Bekommt nie einen FSM-Auftrag (E1), nur Jobs, die das Rig plant
  # (Planer ab E2.3, Schalter KI_HG_AKTIV). Gleiche Version wie «ollama»: 0.35.1 lädt gemma4 (geprüft
  # 2026-10-11). Modelle liegen im gemeinsamen Speicher von «ollama» und sind hier nur lesbar.
  # Aufrufe immer mit options use_mmap false, num_gpu 0, num_ctx KI_HG_NUM_CTX (16384).
  ollama-gruendlich:
    image: ollama/ollama:0.35.1
    container_name: eventline-ki-ollama-gruendlich
    restart: unless-stopped
    networks: [ki-intern]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 15m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NOPRUNE: "1"
      OLLAMA_LOAD_TIMEOUT: 15m
      # Prompt-Cache von llama-server AUS wie bei «ollama» (README «Speicher der GPU-Instanz: Prompt-Cache aus»; hier
      # 16.10.2026, Messnacht 15./16.10.): mit Standard 8192 MiB wuchs «gruendlich» beim 26B nach wenigen Dokumenten um
      # 1,5–2 GiB über den Stand nach dem Laden — 8 der 13 Entladungen der Messnacht. Der Slot-eigene Wiedergebrauch des
      # gemeinsamen Anfangs bleibt.
      LLAMA_ARG_CACHE_RAM: "0"
    volumes:
      - /srv/eventline-ki/data/ollama-gruendlich:/root/.ollama
      - /srv/eventline-ki/data/ollama/models:/root/.ollama/models:ro
    cgroup_parent: *ki_slice
    # CPU-Gewicht im KI-Slice (Trust one bleibt davon unberührt — dort zählt das Slice-Gewicht). Seit 16.10.2026 rechnet das
    # 26B auch tagsüber (KI_HG_TAG): 256 → cpu.weight 35 (vorher 1536 → 138), Dienst/«ollama»/Whisper 2048 → 174 — bei
    # Wettstreit bekommen Wartende (Extraktion, OCR, Einbettung) rund 5× so viel CPU wie das 26B. Nachts ohne Wirkung:
    # dann rechnet neben dem 26B kaum etwas (Nachtarbeit und Indexe laufen vorher). Messung README «Tagsüber arbeiten».
    cpu_shares: 256
    # Gemessen 2026-10-11 (E2.2, README «Zwei Instanzen»): gemma4 26B anon 15,7 GB geladen, 16,3 GB mit
    # 8k-Prompt; Rest bis 19g ist Seitencache beim Laden (wird zurückgegeben, kein OOM).
    mem_limit: 19g
    # Kein Swap für das Hauptmodell — absichtlich 19g + 4096 Byte (eine Seite) statt genau 19g: bei
    # memswap = mem schreibt runc memory.swap.max=0 nur direkt, nicht als systemd-Eigenschaft, und das
    # nächste «systemctl daemon-reload» setzte es zurück auf «max» (gemessen 2026-10-11). Mit einer Seite
    # Unterschied geht der Wert als MemorySwapMax=4096 an systemd und bleibt.
    memswap_limit: 20401098752
    oom_score_adj: -300
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  whisper:
    # Stand Okt 2024 (faster-whisper 1.0.3, CUDA 12.2); Projekt heisst inzwischen «speaches».
    image: fedirz/faster-whisper-server:latest-cuda@sha256:0b64050ad0b9244745746b652473ee42a8d5454d501877a252c3e65f631ffc99
    container_name: eventline-ki-whisper
    restart: unless-stopped
    networks: [ki-intern]
    environment:
      WHISPER__MODEL: ${KI_MODELL_WHISPER:-Systran/faster-whisper-medium}
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__TTL: "300"
      # Kein Internet im Netz ki-intern: das Modell wird vorab über das Profil
      # «modelle» in den Cache geladen (install.sh), Whisper darf nur offline lesen.
      HF_HUB_OFFLINE: "1"
      ENABLE_UI: "false"
    # Das Image startet mit «uv run», das beim Start die Python-Umgebung neu auflöst und
    # dafür PyPI braucht — im Netz ki-intern gibt es kein Internet → Crash-Schleife.
    # --no-sync nimmt die im Image fertig gebaute Umgebung (offline geprüft).
    command: ["uv", "run", "--no-sync", "uvicorn", "--factory", "faster_whisper_server.main:create_app"]
    volumes:
      - /srv/eventline-ki/data/whisper:/root/.cache/huggingface
    cgroup_parent: *ki_slice
    oom_score_adj: *oom_ki
    cpu_shares: *cpu_vorrang
    # SPEC sagt 4g — damit wurde Whisper beim Laden vom Kernel getötet (memcg-OOM, 2026-10-02):
    # CUDA-/cuDNN-Bibliotheken und das Modell werden gelesen, der Seitencache zählt im cgroup mit.
    mem_limit: 8g
    <<: *gpu
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 || python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: pgvector/pgvector:pg16
    container_name: eventline-ki-db
    restart: unless-stopped
    networks: [ki-intern]
    environment:
      POSTGRES_USER: eventline
      POSTGRES_DB: eventline_ki
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD fehlt — Compose mit --env-file /etc/eventline-ki/env starten}
    volumes:
      - /srv/eventline-ki/data/pg:/var/lib/postgresql/data
    shm_size: 256m
    cgroup_parent: *ki_slice
    oom_score_adj: *oom_ki
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventline -d eventline_ki"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  egress:
    # Squid 6.13 auf Ubuntu 24.04 (Ubuntu vergibt keine Versions-Tags, darum Digest).
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: eventline-ki-egress
    restart: unless-stopped
    networks: [ki-intern, ki-egress]
    # Verzeichnis statt Einzeldatei einbinden: ein Update ersetzt squid.conf durch eine neue
    # Datei (neuer Inode) — ein Einzeldatei-Mount zeigte dann weiter die alte Fassung, und
    # «squid -k reconfigure» (install.sh) läse die alte Erlaubnisliste.
    volumes:
      - ./egress:/etc/squid/eventline:ro
    # Der Entrypoint des Images spiegelt /var/log/squid/*.log nach stdout; Squid selbst
    # darf stdout nicht öffnen (läuft als «proxy», siehe squid.conf). Die Schleife rotiert
    # das Protokoll täglich (logfile_rotate 1), Docker kappt stdout per json-file-Limit.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        (while sleep 86400; do squid -k rotate -f /etc/squid/eventline/squid.conf >/dev/null 2>&1; done) &
        exec /usr/local/bin/entrypoint.sh -f /etc/squid/eventline/squid.conf -NYC
    # Live-Pfad: ohne egress kein Sync — darum wie die übrigen KI-Container geschützt.
    cgroup_parent: *ki_slice
    oom_score_adj: *oom_ki
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "squid -k check -f /etc/squid/eventline/squid.conf"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dienst:
    build:
      context: ./dienst
      args:
        KI_BUILD: ${KI_BUILD:-dev}
    image: eventline-ki/dienst:local
    container_name: eventline-ki-dienst
    restart: unless-stopped
    user: "1500:1500"
    networks: [ki-intern]
    env_file: /etc/eventline-ki/env
    environment:
      # Einziger Weg nach draussen: der Squid mit Erlaubnisliste.
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: ollama,ollama-gruendlich,whisper,db,localhost,127.0.0.1
      OLLAMA_URL: http://ollama:11434
      OLLAMA_GRUENDLICH_URL: http://ollama-gruendlich:11434
      KI_HG_SLICE_DIR: /ki-slice
      WHISPER_URL: http://whisper:8000
      PG_HOST: db
      PG_USER: eventline
      PG_DB: eventline_ki
      KI_MODELL_WHISPER: ${KI_MODELL_WHISPER:-Systran/faster-whisper-medium}
      KI_DATA_DIR: /data
      # Temp-Dateien (Downloads, OCR-Zwischenstände, Audio) nur im Tresor.
      TMPDIR: /data/tmp
    volumes:
      - /srv/eventline-ki/data/dienst:/data
      # NAS nur lesend; die Freigaben darunter sind einzelne CIFS-Mounts (Host: shared). rslave: ein
      # (Wieder-)Einhängen nach dem Container-Start kommt im Container an — mit rprivate (Standard) sähe
      # der Archiv-Index nach einem Remount leere Ordner (Review 2026-10-11, Befund 1).
      - type: bind
        source: /mnt/eventline-nas
        target: /mnt/eventline-nas
        read_only: true
        bind:
          propagation: rslave
      - ./probelauf:/probelauf:ro
      # Speicher-Tor des Hauptmodells (Masterplan §2.4, E2.3): der Dienst hat einen eigenen Cgroup-Namespace
      # und sähe den KI-Slice sonst nicht. Nur lesend; gelesen werden memory.current, memory.max, memory.stat.
      - /sys/fs/cgroup/system.slice/system-eventlineki.slice:/ki-slice:ro
      # Kleiner RAM-Puffer für Bibliotheken, die TMPDIR ignorieren — nie auf Platte.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 268435456
          mode: 01777
    # Dateisystem schreibgeschützt: Dokument-Reste können nur in /data (Tresor) landen.
    read_only: true
    depends_on:
      db:
        condition: service_healthy
      egress:
        condition: service_started
      ollama:
        condition: service_started
      whisper:
        condition: service_started
    cgroup_parent: *ki_slice
    oom_score_adj: *oom_ki
    cpu_shares: *cpu_vorrang
    mem_limit: 4g
    # GPU nur für nvidia-smi (Name + freier VRAM in /health und im Herzschlag);
    # gerechnet wird in ollama/whisper.
    <<: *gpu
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8700/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    build: ./caddy
    image: eventline-ki/caddy:local
    container_name: eventline-ki-caddy
    restart: unless-stopped
    networks: [ki-intern, ki-egress]
    env_file: /etc/eventline-ki/caddy.env
    ports:
      - "192.168.1.128:443:443"
      - "10.9.0.2:443:443"
      - "127.0.0.1:443:443"
    # Verzeichnis statt Einzeldatei (wie bei egress): sonst sieht «caddy reload» nach einem
    # Update weiter das alte Caddyfile. Das Image startet mit /etc/caddy/Caddyfile.
    volumes:
      - ./caddy:/etc/caddy:ro
      - /srv/eventline-ki/data/caddy:/data
      - caddy-config:/config
    depends_on:
      dienst:
        condition: service_started
    cgroup_parent: *ki_slice
    oom_score_adj: *oom_ki
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Profil «modelle»: einmalige Downloads mit Internet (Netz ki-egress), weil die
  # Arbeits-Container keinen Zugang haben. Aufruf siehe install.sh / README.
  # ---------------------------------------------------------------------------
  ollama-modelle:
    image: ollama/ollama:0.35.1
    profiles: [modelle]
    networks: [ki-egress]
    environment:
      # Standard = Modellentscheid 2026-10-03 (SPEC §2.1), gleich wie config.py; die env-Datei geht vor.
      KI_MODELL_TEXT: ${KI_MODELL_TEXT:-gemma3:4b}
      KI_MODELL_BILD: ${KI_MODELL_BILD:-gemma3:4b}
      KI_MODELL_EMBED: ${KI_MODELL_EMBED:-bge-m3}
      # Hauptmodell-Leiter für ollama-gruendlich (Masterplan §2.4): «Name@Bedarf,…», geladen werden die Namen.
      KI_HG_MODELLE: ${KI_HG_MODELLE:-}
      KI_MODELLE_NEU_LADEN: ${KI_MODELLE_NEU_LADEN:-0}
      OLLAMA_NOPRUNE: "1"
    volumes:
      - /srv/eventline-ki/data/ollama:/root/.ollama
    cgroup_parent: *ki_slice
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama serve >/dev/null 2>&1 &
        for i in $$(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 1; done
        HG=$$(echo "$$KI_HG_MODELLE" | tr ',' ' ')
        for m in "$$KI_MODELL_TEXT" "$$KI_MODELL_BILD" "$$KI_MODELL_EMBED" $$HG; do
          m="$${m%%@*}"
          [ -n "$$m" ] || continue
          # Vorhandene Modelle NIE still aktualisieren: «ollama pull» holt sonst den neuesten Stand des
          # Tags (am 2026-10-11 war gemma3:4b im Katalog neu gepackt — ein Pull hätte das Live-Modell
          # getauscht). Bewusst aktualisieren: KI_MODELLE_NEU_LADEN=1 (README «Modell wechseln»).
          if [ "$${KI_MODELLE_NEU_LADEN:-0}" != "1" ] && ollama show "$$m" >/dev/null 2>&1; then
            echo "Modell $$m vorhanden — nicht neu geladen"; continue
          fi
          echo "Lade Modell $$m"; ollama pull "$$m"
        done
        ollama list

  whisper-modelle:
    image: python:3.12-slim-bookworm
    profiles: [modelle]
    networks: [ki-egress]
    environment:
      KI_MODELL_WHISPER: ${KI_MODELL_WHISPER:-Systran/faster-whisper-medium}
    volumes:
      - /srv/eventline-ki/data/whisper:/root/.cache/huggingface
    cgroup_parent: *ki_slice
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        pip install -q --no-cache-dir huggingface_hub
        python -c "import os; from huggingface_hub import snapshot_download; p = snapshot_download(os.environ['KI_MODELL_WHISPER']); print('Whisper-Modell bereit:', p)"

networks:
  ki-intern:
    internal: true
  ki-egress:
    driver: bridge

volumes:
  caddy-config: {}
