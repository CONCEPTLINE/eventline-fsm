# EVENTLINE Lokale KI — Ausgangs-Proxy mit Erlaubnisliste (SPEC §2.1 «egress»)
#
# Der KI-Dienst hat keine Route ins Internet; alles, was er nach draussen will,
# muss hier als CONNECT auf Port 443 durch. Erlaubt sind genau zwei Hosts: das
# Supabase-Projekt des FSM (Transit-Bucket, signierte URLs liegen auf demselben
# Host) und das FSM (Warteschlange). Jeder andere Host wird mit 403 abgewiesen —
# auch andere Supabase-Projekte: so kann kein Dokument zu einem KI-Anbieter oder
# in einen fremden Bucket.

http_port 3128

# Keine Caches: der Proxy darf nichts von dem behalten, was hindurchgeht.
cache deny all
cache_mem 8 MB
memory_pools off

# Zugriffs-Protokoll: nur Host + Status, TLS-Inhalt ist für Squid ohnehin unsichtbar
# (CONNECT-Tunnel). Squid läuft als Benutzer «proxy» und darf das stdout des Containers
# nicht öffnen (die Pipe gehört root → FATAL beim Start). Deshalb Dateien unter
# /var/log/squid, die der Entrypoint des Images per tail -F nach stdout spiegelt
# (docker compose logs egress). Eine Vorgängerdatei bei Rotation; den täglichen
# «squid -k rotate» löst docker-compose.yml aus, damit die Datei nie unbegrenzt wächst.
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
logfile_rotate 1
cache_store_log none
pid_filename /run/squid.pid
coredump_dir /tmp

# Erlaubnisliste — nur diese Ziele, nur TLS. Ohne führenden Punkt = exakt dieser Host.
acl ziel_erlaubt dstdomain uxtotpniwbwyoznwkygd.supabase.co
acl ziel_erlaubt dstdomain eventline-fsm-usyk.vercel.app
acl tls_port port 443
acl CONNECT method CONNECT

# Reihenfolge ist entscheidend: zuerst alles Nicht-CONNECT weg, dann falsche
# Ports, dann die Erlaubnisliste, Rest verboten.
http_access deny !CONNECT
http_access deny CONNECT !tls_port
http_access allow CONNECT ziel_erlaubt
http_access deny all

# Keine Weitergabe von Client-Informationen, kein Hinweis auf uns.
forwarded_for delete
via off
httpd_suppress_version_string on
visible_hostname eventline-ki-egress

# Kein Cache-Manager, keine ICP/HTCP-Abfragen.
icp_port 0
htcp_port 0
